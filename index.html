<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>三國1943：赤壁烽火</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; -webkit-touch-callout: none; }
    body {
      background: #0d0d11;
      color: #f0e6d2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none; /* 防止手機滾動頁面 */
      user-select: none;
    }
    #gameWrapper {
      position: relative;
      border: 3px solid #d4af37;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
      background: #000;
      max-width: 100vw;
      max-height: 100vh;
      overflow: hidden;
    }
    canvas {
      display: block;
      background: #111;
      touch-action: none;
    }
    .hud {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 3px #000;
      pointer-events: none;
      z-index: 5;
    }
    .hud b { color: #d4af37; }

    /* 手機專屬大招觸控按鈕 */
    #mobileBombBtn {
      position: absolute;
      bottom: 24px;
      right: 20px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle, #ff5722 0%, #8a1900 100%);
      border: 3px solid #ffd700;
      color: #fff;
      font-weight: bold;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(255, 69, 0, 0.7);
      cursor: pointer;
      z-index: 20;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s;
    }
    #mobileBombBtn:active {
      transform: scale(0.9);
      background: radial-gradient(circle, #ff8c00 0%, #cc3300 100%);
    }

    .overlay-screen {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 30;
    }
    .overlay-screen h1 {
      color: #d4af37;
      font-size: 24px;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }
    .overlay-screen p {
      font-size: 14px;
      color: #bbb;
      margin-bottom: 20px;
      line-height: 1.6;
      max-width: 340px;
    }
    .btn {
      background: linear-gradient(180deg, #d4af37 0%, #997819 100%);
      border: none;
      color: #000;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: 0.2s;
    }
    .btn:hover {
      transform: scale(1.05);
      background: #ffcc00;
    }
  </style>
</head>
<body>

  <!-- 外部音樂播放器（讀取同目錄下的 bgm.mp3） -->
  <audio id="externalBgm" loop preload="auto">
    <source src="bgm.mp3" type="audio/mpeg">
  </audio>

  <div id="gameWrapper">
    <canvas id="gameCanvas" width="450" height="650"></canvas>
    
    <!-- 頂部狀態列 -->
    <div class="hud" id="hud" style="display: none;">
      <div>關卡: <b id="hudStage">第一關 虎牢關</b></div>
      <div>大招: <b id="hudBombs">1</b></div>
      <div>軍力: <b id="hudHp">100%</b></div>
      <div>得分: <b id="hudScore">0</b></div>
    </div>

    <!-- 手機觸控大招按鈕 -->
    <div id="mobileBombBtn" style="display: none;">
      <span>天火</span>
      <small id="mobileBombCount" style="font-size: 10px; color:#ffeb3b;">剩1次</small>
    </div>

    <!-- 起始畫面 -->
    <div class="overlay-screen" id="startScreen">
      <h1>⚔️ 三國 1943 街機戰</h1>
      <p>單騎破萬軍！戰機自動連續射擊，避開綿密箭雨，迎戰各關歷史名將！</p>
      <div style="margin-bottom: 22px; font-size: 13px; line-height: 1.8; color: #ddd;">
        <span style="color:#d4af37;">【電腦鍵盤】</span><br>
        方向鍵 / WASD 移動，<b>空白鍵 (Space)</b> 釋放全螢幕天火大招<br>
        <span style="color:#d4af37;">【手機觸控】</span><br>
        單指直接在螢幕上滑動戰機，右下角點擊<b>「天火」按鈕</b>放招
      </div>
      <button class="btn" onclick="startGame()">拔劍啟程！</button>
    </div>

    <!-- 結算過關畫面 -->
    <div class="overlay-screen" id="stageClearScreen" style="display: none;">
      <h1 style="color:#7ef07e;">🏆 大捷！斬落敵將！</h1>
      <p id="stageClearText">敵將已被徹底降伏！即將挺進下一張名戰役地圖！</p>
      <button class="btn" onclick="nextStage()">挺進下一關 ➔</button>
    </div>

    <!-- 陣亡畫面 -->
    <div class="overlay-screen" id="gameOverScreen" style="display: none;">
      <h1 style="color:#ff6b6b;">💀 英雄力竭 · 鳴金退陣</h1>
      <p>勝敗乃兵家常事，少俠請重新整軍再來！</p>
      <button class="btn" onclick="restartGame()">重新起兵</button>
    </div>
  </div>

  <script>
    /* ==========================================================================
       1. 音效控制器
       ========================================================================== */
    class SoundController {
      constructor() {
        this.audioElement = document.getElementById('externalBgm');
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playBgm() {
        this.init();
        if (this.audioElement) {
          this.audioElement.play().catch(() => {});
        }
      }
      stopBgm() {
        if (this.audioElement) {
          this.audioElement.pause();
          this.audioElement.currentTime = 0;
        }
      }
      playPew() {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(550, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.08);
        } catch(e) {}
      }
      playBoom() {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(130, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(25, this.ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.3);
        } catch(e) {}
      }
    }
    const snd = new SoundController();

    /* ==========================================================================
       2. 關卡長度設定（目標長度提升至 2800~3600，保證 60 秒以上體驗）
       ========================================================================== */
    const STAGES = [
      {
        id: 1,
        name: '第一關：虎牢關前 · 萬木成灰',
        bgColor: '#241708',
        gridColor: '#36220b',
        riverColor: '#2b1a0c',
        scrollSpeed: 1.2,
        targetDistance: 2600, // 約 40~45 秒雜兵巡邏 + 20 秒 Boss 戰
        boss: {
          name: '飛將 · 呂布',
          quote: '「人中呂布，馬中赤兔！爾等鼠輩一齊上罷！」',
          hp: 120,
          maxHp: 120,
          color: '#d12323',
          bulletColor: '#ff4444'
        }
      },
      {
        id: 2,
        name: '第二關：長坂坡野 · 白馬銀槍',
        bgColor: '#081f0d',
        gridColor: '#123318',
        riverColor: '#0a2624',
        scrollSpeed: 1.4,
        targetDistance: 3000,
        boss: {
          name: '先鋒 · 夏侯惇',
          quote: '「父精母血不可棄也！休走，留下首級！」',
          hp: 180,
          maxHp: 180,
          color: '#2a629a',
          bulletColor: '#6bb3ff'
        }
      },
      {
        id: 3,
        name: '第三關：赤壁江面 · 烈火戰船',
        bgColor: '#061421',
        gridColor: '#0c263d',
        riverColor: '#040b12',
        scrollSpeed: 1.6,
        targetDistance: 3400,
        boss: {
          name: '丞相 · 曹操 (連環樓船)',
          quote: '「寧教我負天下人，休教天下人負我！」',
          hp: 250,
          maxHp: 250,
          color: '#991f88',
          bulletColor: '#ff99ff'
        }
      }
    ];

    /* ==========================================================================
       3. 核心變數與遊戲循環
       ========================================================================== */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let currentStageIdx = 0;
    let stageDistance = 0;
    let score = 0;
    let gameState = 'START';
    let keys = {};
    let animationFrameId = null;

    const player = {
      x: 210,
      y: 540,
      w: 32,
      h: 36,
      speed: 4.8,
      hp: 100,
      maxHp: 100,
      shotCooldown: 0,
      weaponLevel: 1,
      bombs: 1 // 一開始贈送 1 個大招
    };

    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let items = [];
    let particles = [];
    let boss = null;
    let bossQuoteTimer = 0;
    let bgScrollY = 0;
    let flashAlpha = 0; // 大招短暫閃白光

    /* ==========================================================================
       4. 操控事件：鍵盤 (空白鍵大招) + 手機觸控拖曳
       ========================================================================== */
    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      // 空白鍵啟動大招
      if (e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        useUltimateBomb();
      }
    });
    window.addEventListener('keyup', e => {
      keys[e.key] = false;
    });

    // 手機觸控拖曳戰機
    let isTouching = false;
    let touchOffset = { x: 0, y: 0 };

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const tx = (touch.clientX - rect.left) * scaleX;
      const ty = (touch.clientY - rect.top) * scaleY;

      isTouching = true;
      touchOffset.x = player.x - tx;
      touchOffset.y = player.y - ty;
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (!isTouching || gameState !== 'PLAYING') return;
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      
      let nextX = (touch.clientX - rect.left) * scaleX + touchOffset.x;
      let nextY = (touch.clientY - rect.top) * scaleY + touchOffset.y;

      // 約束在邊界內
      player.x = Math.max(10, Math.min(canvas.width - player.w - 10, nextX));
      player.y = Math.max(20, Math.min(canvas.height - player.h - 10, nextY));
    }, { passive: false });

    canvas.addEventListener('touchend', () => { isTouching = false; });

    // 手機版大招按鈕
    const mobileBtn = document.getElementById('mobileBombBtn');
    mobileBtn.addEventListener('touchstart', e => {
      e.preventDefault();
      e.stopPropagation();
      useUltimateBomb();
    });
    mobileBtn.addEventListener('click', e => {
      e.preventDefault();
      useUltimateBomb();
    });

    /* ==========================================================================
       5. 天火大招系統 (全螢幕短閃白光 + 清除敵砲火與雜兵)
       ========================================================================== */
    function useUltimateBomb() {
      if (gameState !== 'PLAYING' || player.bombs <= 0) return;
      player.bombs--;
      snd.playBoom();

      // 1. 畫面閃白
      flashAlpha = 1.0;

      // 2. 徹底清空所有敵方子彈
      enemyBullets = [];

      // 3. 消滅所有雜兵 (除 Boss 外全部引爆)
      enemies.forEach(en => {
        createExplosion(en.x, en.y, '#ffaa00', 12);
        score += 150;
      });
      enemies = [];

      // 4. 若 Boss 在場，給予 Boss 重創
      if (boss && boss.hp > 0) {
        boss.hp -= 35;
        createExplosion(boss.x + 35, boss.y + 25, '#ff3300', 20);
      }

      updateHud();
    }

    function updateHud() {
      document.getElementById('hudHp').innerText = Math.max(0, player.hp) + '%';
      document.getElementById('hudScore').innerText = score;
      document.getElementById('hudBombs').innerText = player.bombs;
      document.getElementById('mobileBombCount').innerText = `剩${player.bombs}次`;
    }

    /* ==========================================================================
       6. 遊戲流程控制
       ========================================================================== */
    function startGame() {
      document.getElementById('startScreen').style.display = 'none';
      document.getElementById('stageClearScreen').style.display = 'none';
      document.getElementById('gameOverScreen').style.display = 'none';
      document.getElementById('hud').style.display = 'flex';
      document.getElementById('mobileBombBtn').style.display = 'flex';
      
      score = 0;
      player.hp = 100;
      player.weaponLevel = 1;
      player.bombs = 1; // 開局贈送 1 個大招
      player.x = 210;
      player.y = 540;

      loadStage(0);
      gameState = 'PLAYING';
      snd.playBgm();
      
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function loadStage(idx) {
      currentStageIdx = idx;
      stageDistance = 0;
      boss = null;
      bossQuoteTimer = 0;
      enemies = [];
      bullets = [];
      enemyBullets = [];
      items = [];
      particles = [];
      flashAlpha = 0;
      document.getElementById('hudStage').innerText = STAGES[idx].name.split('：')[0];
      updateHud();
    }

    function nextStage() {
      document.getElementById('stageClearScreen').style.display = 'none';
      if (currentStageIdx + 1 < STAGES.length) {
        loadStage(currentStageIdx + 1);
        player.hp = Math.min(100, player.hp + 40);
        player.bombs += 1; // 每一關通關再獎勵 1 個大招
        player.x = 210;
        player.y = 540;
        gameState = 'PLAYING';
        
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        animationFrameId = requestAnimationFrame(gameLoop);
      } else {
        alert('👑【千秋鼎盛】恭喜閣下通關赤壁三大名戰役，一統九州！');
        document.getElementById('startScreen').style.display = 'flex';
        document.getElementById('mobileBombBtn').style.display = 'none';
        gameState = 'START';
      }
    }

    function restartGame() {
      document.getElementById('gameOverScreen').style.display = 'none';
      startGame();
    }

    /* ==========================================================================
       7. 物理更新與繪圖
       ========================================================================== */
    function gameLoop() {
      if (gameState === 'PLAYING') {
        update();
        draw();
        animationFrameId = requestAnimationFrame(gameLoop);
      }
    }

    function update() {
      const curStage = STAGES[currentStageIdx];

      bgScrollY += curStage.scrollSpeed;
      if (!boss) {
        stageDistance += curStage.scrollSpeed;
        if (stageDistance >= curStage.targetDistance) {
          spawnBoss(curStage.boss);
        }
      }

      // 鍵盤移動
      if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && player.x > 10) player.x -= player.speed;
      if ((keys['ArrowRight'] || keys['d'] || keys['D']) && player.x < canvas.width - player.w - 10) player.x += player.speed;
      if ((keys['ArrowUp'] || keys['w'] || keys['W']) && player.y > 20) player.y -= player.speed;
      if ((keys['ArrowDown'] || keys['s'] || keys['S']) && player.y < canvas.height - player.h - 10) player.y += player.speed;

      // 自動射擊
      if (player.shotCooldown > 0) player.shotCooldown--;
      if (player.shotCooldown <= 0) {
        firePlayerBullet();
        player.shotCooldown = 9;
      }

      // 雜兵巡邏波次
      if (!boss && Math.random() < 0.045) {
        spawnEnemyWave();
      }

      // 子彈更新
      bullets.forEach(b => { b.y -= b.vy; b.x += b.vx; });
      bullets = bullets.filter(b => b.y > -20 && b.x > 0 && b.x < canvas.width);

      enemyBullets.forEach(b => { b.y += b.vy; b.x += b.vx; });
      enemyBullets = enemyBullets.filter(b => b.y < canvas.height + 20 && b.x > 0 && b.x < canvas.width);

      // 小兵行動
      enemies.forEach((en) => {
        en.y += en.vy;
        en.x += Math.sin(en.y * 0.035 + en.seed) * 2.2;
        en.shootTimer--;
        if (en.shootTimer <= 0) {
          enemyBullets.push({ x: en.x + 12, y: en.y + 20, vx: 0, vy: 3.6, color: '#ff6666' });
          en.shootTimer = 65 + Math.random() * 45;
        }

        bullets.forEach((b, bIdx) => {
          if (checkHit(b, { x: en.x, y: en.y, w: 26, h: 26 })) {
            en.hp -= 10;
            bullets.splice(bIdx, 1);
            createExplosion(b.x, b.y, '#fff', 3);
            if (en.hp <= 0) {
              snd.playBoom();
              createExplosion(en.x, en.y, '#ffaa00', 8);
              score += 150;
              if (Math.random() < 0.22) spawnItem(en.x, en.y);
            }
          }
        });

        if (checkHit({ x: en.x, y: en.y, w: 24, h: 24 }, player)) {
          player.hp -= 12;
          en.hp = 0;
          snd.playBoom();
        }
      });
      enemies = enemies.filter(en => en.y < canvas.height + 30 && en.hp > 0);

      // Boss 邏輯
      if (boss && boss.hp > 0) {
        bossQuoteTimer++;
        if (boss.y < 85) boss.y += 1.2;
        boss.x += Math.sin(Date.now() * 0.002) * 2.6;

        boss.shootTimer--;
        if (boss.shootTimer <= 0) {
          for (let angle = -0.6; angle <= 0.6; angle += 0.3) {
            enemyBullets.push({
              x: boss.x + 35,
              y: boss.y + 60,
              vx: Math.sin(angle) * 4.2,
              vy: Math.cos(angle) * 4.2,
              color: curStage.boss.bulletColor
            });
          }
          boss.shootTimer = 48;
        }

        bullets.forEach((b, bIdx) => {
          if (checkHit(b, { x: boss.x, y: boss.y, w: 70, h: 60 })) {
            boss.hp -= 4;
            bullets.splice(bIdx, 1);
            createExplosion(b.x, b.y, '#ffd700', 3);
            
            if (boss.hp <= 0) {
              snd.playBoom();
              createExplosion(boss.x + 35, boss.y + 30, '#ff3300', 35);
              score += 2500;
              gameState = 'CLEAR';
              setTimeout(() => {
                document.getElementById('stageClearScreen').style.display = 'flex';
                document.getElementById('stageClearText').innerText = `【${curStage.boss.name}】已被徹底降伏！部隊正開拔前往下一張歷史地圖！`;
              }, 700);
            }
          }
        });
      }

      // 玩家受創
      enemyBullets.forEach((eb, ebIdx) => {
        if (checkHit(eb, { x: player.x + 6, y: player.y + 6, w: 20, h: 24 })) {
          player.hp -= 10;
          enemyBullets.splice(ebIdx, 1);
          createExplosion(player.x, player.y, '#ff0000', 6);
          if (player.hp <= 0) {
            snd.playBoom();
            gameState = 'GAMEOVER';
            document.getElementById('gameOverScreen').style.display = 'flex';
            snd.stopBgm();
          }
        }
      });

      // 拾取寶物 (黃方塊提升彈幕，綠方塊回血，紅方塊補大招)
      items.forEach((it, itIdx) => {
        it.y += 1.2;
        if (checkHit(it, player)) {
          if (it.type === 'weapon') player.weaponLevel = Math.min(3, player.weaponLevel + 1);
          else if (it.type === 'heal') player.hp = Math.min(100, player.hp + 25);
          else if (it.type === 'bomb') player.bombs += 1;
          items.splice(itIdx, 1);
          score += 200;
        }
      });
      items = items.filter(it => it.y < canvas.height + 20);

      // 粒子更新
      particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.alpha -= 0.04; });
      particles = particles.filter(p => p.alpha > 0);

      // 閃白消退
      if (flashAlpha > 0) flashAlpha -= 0.08;

      updateHud();
    }

    function firePlayerBullet() {
      snd.playPew();
      if (player.weaponLevel === 1) {
        bullets.push({ x: player.x + 14, y: player.y, vx: 0, vy: 9.5 });
      } else if (player.weaponLevel === 2) {
        bullets.push({ x: player.x + 6, y: player.y, vx: -0.6, vy: 9.5 });
        bullets.push({ x: player.x + 22, y: player.y, vx: 0.6, vy: 9.5 });
      } else {
        bullets.push({ x: player.x + 14, y: player.y - 2, vx: 0, vy: 10 });
        bullets.push({ x: player.x + 4, y: player.y, vx: -1.5, vy: 9.5 });
        bullets.push({ x: player.x + 24, y: player.y, vx: 1.5, vy: 9.5 });
      }
    }

    function spawnEnemyWave() {
      const startX = 40 + Math.random() * (canvas.width - 110);
      for (let i = 0; i < 3; i++) {
        enemies.push({
          x: startX + i * 24,
          y: -30 - i * 36,
          vy: 2.1 + Math.random() * 0.7,
          hp: 20,
          shootTimer: 45 + i * 20,
          seed: Math.random() * 10
        });
      }
    }

    function spawnBoss(bConfig) {
      boss = {
        name: bConfig.name,
        quote: bConfig.quote,
        x: canvas.width / 2 - 35,
        y: -70,
        hp: bConfig.hp,
        maxHp: bConfig.maxHp,
        color: bConfig.color,
        shootTimer: 30
      };
      bossQuoteTimer = 0;
    }

    function spawnItem(x, y) {
      const rand = Math.random();
      let type = 'weapon';
      if (rand < 0.45) type = 'weapon';
      else if (rand < 0.85) type = 'heal';
      else type = 'bomb'; // 偶爾掉落大招補給

      items.push({ x, y, type, w: 18, h: 18 });
    }

    function createExplosion(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          color,
          alpha: 1
        });
      }
    }

    function checkHit(a, b) {
      const aw = a.w || 4, ah = a.h || 8;
      const bw = b.w || 4, bh = b.h || 8;
      return (a.x < b.x + bw && a.x + aw > b.x && a.y < b.y + bh && a.y + ah > b.y);
    }

    /* ==========================================================================
       8. 畫面繪製
       ========================================================================== */
    function draw() {
      const curStage = STAGES[currentStageIdx];

      ctx.fillStyle = curStage.bgColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = curStage.gridColor;
      ctx.lineWidth = 1;
      const offsetY = bgScrollY % 40;
      for (let y = offsetY; y < canvas.height; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      ctx.fillStyle = curStage.riverColor;
      ctx.beginPath();
      const waveOffset = bgScrollY * 0.025;
      ctx.moveTo(80 + Math.sin(waveOffset) * 20, 0);
      ctx.lineTo(160 + Math.sin(waveOffset) * 20, 0);
      ctx.lineTo(200 + Math.sin(waveOffset + 2) * 30, canvas.height);
      ctx.lineTo(110 + Math.sin(waveOffset + 2) * 30, canvas.height);
      ctx.fill();

      // 掉落道具
      items.forEach(it => {
        if (it.type === 'weapon') ctx.fillStyle = '#ffd700';
        else if (it.type === 'heal') ctx.fillStyle = '#44ff44';
        else ctx.fillStyle = '#ff5722';
        ctx.fillRect(it.x, it.y, 16, 16);
        ctx.fillStyle = '#000';
        ctx.font = 'bold 11px sans-serif';
        const label = it.type === 'weapon' ? '劍' : (it.type === 'heal' ? '藥' : '火');
        ctx.fillText(label, it.x + 3, it.y + 12);
      });

      // 戰機
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.fillStyle = '#d4af37';
      ctx.beginPath();
      ctx.moveTo(16, 0);
      ctx.lineTo(32, 28);
      ctx.lineTo(16, 20);
      ctx.lineTo(0, 28);
      ctx.fill();
      ctx.fillStyle = '#f0f0f0';
      ctx.fillRect(11, 4, 10, 24);
      ctx.fillStyle = '#ff2222';
      ctx.beginPath();
      ctx.arc(16, 4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 小兵
      enemies.forEach(en => {
        ctx.fillStyle = '#aa3333';
        ctx.beginPath();
        ctx.moveTo(en.x + 12, en.y + 24);
        ctx.lineTo(en.x, en.y);
        ctx.lineTo(en.x + 24, en.y);
        ctx.fill();
      });

      // Boss
      if (boss && boss.hp > 0) {
        ctx.fillStyle = boss.color;
        ctx.fillRect(boss.x, boss.y, 70, 50);
        ctx.fillStyle = '#d4af37';
        ctx.fillRect(boss.x + 20, boss.y + 10, 30, 25);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText(boss.name, boss.x + 4, boss.y - 10);
        
        ctx.fillStyle = '#440000';
        ctx.fillRect(boss.x, boss.y - 6, 70, 4);
        ctx.fillStyle = '#ff3333';
        ctx.fillRect(boss.x, boss.y - 6, Math.max(0, (boss.hp / boss.maxHp) * 70), 4);

        if (bossQuoteTimer < 240) {
          ctx.fillStyle = 'rgba(0,0,0,0.85)';
          ctx.fillRect(20, 150, canvas.width - 40, 38);
          ctx.strokeStyle = '#d4af37';
          ctx.strokeRect(20, 150, canvas.width - 40, 38);
          ctx.fillStyle = '#ffd700';
          ctx.font = '13px sans-serif';
          ctx.fillText(boss.quote, 30, 174);
        }
      }

      // 子彈
      ctx.fillStyle = '#66ffff';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, 4, 10));

      enemyBullets.forEach(b => {
        ctx.fillStyle = b.color || '#ff4444';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 3.5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 爆炸粒子
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
        ctx.restore();
      });

      // 大招全螢幕短閃白光
      if (flashAlpha > 0) {
        ctx.save();
        ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
      }
    }
  </script>
</body>
